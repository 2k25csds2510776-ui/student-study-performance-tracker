<!DOCTYPE html>

<html lang="en">


<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">


    <title>
        Exam Tracker
    </title>


    <link rel="stylesheet"
          href="{{ url_for('static', filename='exam.css') }}">

</head>


<body>


    <h1>
        Exam Tracker
    </h1>


    <!-- ==========================
         BACK TO DASHBOARD
    =========================== -->


    <a href="{{ url_for('dashboard') }}">

        Back to Dashboard

    </a>


    <br><br>


    <!-- ==========================
         EXAM FORM
    =========================== -->


    <form id="examForm"
          method="POST"
          action="{{ url_for('exam') }}">


        <!-- SUBJECT -->


        <label for="subject">

            Subject Name:

        </label>


        <input type="text"
               id="subject"
               name="subject"
               required>


        <!-- EXAM NAME -->


        <label for="examName">

            Exam Name:

        </label>


        <input type="text"
               id="examName"
               name="examName"
               placeholder="Example: CT-1, Mid Semester"
               required>


        <!-- EXAM DATE -->


        <label for="examDate">

            Exam Date:

        </label>


        <input type="date"
               id="examDate"
               name="examDate"
               required>


        <!-- SEMESTER -->


        <label for="semester">

            Semester:

        </label>


        <select id="semester"
                name="semester"
                required>


            <option value="1">
                Semester 1
            </option>


            <option value="2">
                Semester 2
            </option>


            <option value="3">
                Semester 3
            </option>


            <option value="4">
                Semester 4
            </option>


            <option value="5">
                Semester 5
            </option>


            <option value="6">
                Semester 6
            </option>


            <option value="7">
                Semester 7
            </option>


            <option value="8">
                Semester 8
            </option>


        </select>


        <!-- BUTTON -->


        <button type="submit">

            Add Exam

        </button>


    </form>


    <!-- ==========================
         EXAM SCHEDULE
    =========================== -->


    <div class="exam_container">


        <h2>

            Exam Schedule

        </h2>


        <table id="examTable">


            <thead>


                <tr>


                    <th>
                        Subject
                    </th>


                    <th>
                        Exam Name
                    </th>


                    <th>
                        Exam Date
                    </th>


                    <th>
                        Semester
                    </th>


                    <th>
                        Action
                    </th>


                </tr>


            </thead>


            <tbody>


                {% for record in exam_data %}


                <tr>


                    <td>

                        {{ record[1] }}

                    </td>


                    <td>

                        {{ record[2] }}

                    </td>


                    <td>

                        {{ record[3] }}

                    </td>


                    <td>

                        Semester {{ record[4] }}

                    </td>


                    <td>


                        <form method="POST"
                              action="{{ url_for(
                                  'delete_exam',
                                  exam_id=record[0]
                              ) }}">


                            <button type="submit"
                                    onclick="return confirm(
                                    'Are you sure you want to delete this exam?'
                                    )">


                                Delete


                            </button>


                        </form>


                    </td>


                </tr>


                {% endfor %}


            </tbody>


        </table>


        <!-- ==========================
             NO EXAMS
        =========================== -->


        {% if not exam_data %}


        <p>

            No exams added yet.

        </p>


        {% endif %}


    </div>


</body>


</html>
