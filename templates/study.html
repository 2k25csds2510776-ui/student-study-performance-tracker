<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Study Hours Tracker</title>

    <link rel="stylesheet"
      href="{{ url_for('static', filename='study.css') }}">

    
</head>

<body>

    <h1>Study Hours Tracker</h1>

    <!-- Study Form -->

    <form id="studyForm"
      method="POST"
      action="{{ url_for('study') }}">

        <label for="subject">Subject Name:</label>
        <input type="text" id="subject" name="subject" required>


        <label for="topic">Topic Studied:</label>
        <input type="text" id="topic" name="topic" required>


        <label for="studyDate">Study Date:</label>
        <input type="date" id="studyDate" name="studyDate" required>


        <label for="hours">Hours Studied:</label>
        <input
            type="number"
            id="hours"
            name="hours"
            min="0.1"
            step="0.1"
            required
        >


        <button type="submit">Add Study Session</button>

    </form>


    <!-- Study Record -->

    <div class="study_container">

        <h2>Study Record</h2>

        <table id="studyTable">

            <thead>

                <tr>
                    <th>Subject</th>
                    <th>Topic</th>
                    <th>Study Date</th>
                    <th>Hours Studied</th>
                </tr>

            </thead>

                <tbody>

    {% for record in study_data %}

    <tr>
        <td>{{ record[1] }}</td>
        <td>{{ record[2] }}</td>
        <td>{{ record[3] }}</td>
        <td>{{ record[4] }} hours</td>

        <td>
            <form method="POST"
                  action="{{ url_for('delete_study', study_id=record[0]) }}">

                <button type="submit">
                    Delete
                </button>

            </form>
        </td>
    </tr>

    {% endfor %}

</tbody>
    

        </table>


        <!-- Total Study Hours -->

        <h2>
            Total Study Hours:
            <span id="totalHours">0</span>
            hours
        </h2>

    </div>


    <script src="{{ url_for('static', filename='study.js') }}"></script>

</body>

</html>
